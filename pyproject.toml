[project]
name = "bank-milvus-day32"
version = "0.1.0"
description = "Day32 Milvus vector database homework with a banking recommendation demo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymilvus==2.6.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_milvus"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true
